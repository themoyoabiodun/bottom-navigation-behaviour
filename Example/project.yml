name: FloatingNavExample
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  FloatingNavKit:
    path: ..
targets:
  FloatingNavExample:
    type: application
    platform: iOS
    sources:
      - path: ExampleApp
    dependencies:
      - package: FloatingNavKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FloatingNavExample
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
